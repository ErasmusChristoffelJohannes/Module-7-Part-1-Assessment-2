<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="calc.css">
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>

    <div class="buttons">
      <button class="fn" data-action="clear">C</button>
      <button class="fn" data-action="backspace">&larr;</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-action="operator" data-value="/">&divide;</button>

      <button data-action="number" data-value="7">7</button>
      <button data-action="number" data-value="8">8</button>
      <button data-action="number" data-value="9">9</button>
      <button class="op" data-action="operator" data-value="*">&times;</button>

      <button data-action="number" data-value="4">4</button>
      <button data-action="number" data-value="5">5</button>
      <button data-action="number" data-value="6">6</button>
      <button class="op" data-action="operator" data-value="-">&minus;</button>

      <button data-action="number" data-value="1">1</button>
      <button data-action="number" data-value="2">2</button>
      <button data-action="number" data-value="3">3</button>
      <button class="op" data-action="operator" data-value="+">+</button>

      <button data-action="negate">+/-</button>
      <button data-action="number" data-value="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </div>

  <script src="calc.js"></script>
</body>
</html>
